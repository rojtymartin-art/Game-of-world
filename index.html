<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Grand City 2.5D – Sandbox</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #09101d; font-family: system-ui, -apple-system, sans-serif; touch-action: none; color: #fff; }
    canvas { display: block; width: 100vw; height: 100vh; }

    #hud {
      position: fixed; top: 12px; left: 12px; pointer-events: none;
      display: flex; flex-direction: column; gap: 6px; max-width: 58vw;
    }
    .panel {
      background: rgba(10, 15, 26, 0.82); border: 1px solid rgba(255,255,255,0.16);
      padding: 8px 12px; border-radius: 12px; backdrop-filter: blur(6px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.45);
    }
    .top-stats { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #moneyHud { font-size: 19px; font-weight: 900; color: #4ade80; }
    #levelHud { font-size: 11px; font-weight: 800; background: rgba(56,189,248,0.2); color: #38bdf8; padding: 2px 7px; border-radius: 6px; }
    #clockHud { font-size: 11px; font-weight: 700; color: #cbd5e1; }
    #starsHud { font-size: 16px; letter-spacing: 2px; margin-top: 2px; min-height: 20px; }
    .sub-row { display: flex; align-items: center; gap: 10px; margin-top: 2px; font-size: 12px; }
    #speedVal { font-size: 16px; font-weight: 900; color: #38bdf8; }
    #districtHud { font-weight: 700; color: #e2e8f0; }

    .hp-wrap { width: 100%; height: 5px; background: rgba(255,255,255,0.12); border-radius: 4px; margin-top: 5px; overflow: hidden; }
    #hpBar { height: 100%; width: 100%; background: linear-gradient(90deg, #22c55e, #4ade80); transition: width 0.15s; }

    .hud-btns { display: flex; gap: 6px; pointer-events: auto; flex-wrap: wrap; }
    .chip-btn {
      cursor: pointer; background: rgba(15, 23, 42, 0.88); border: 1px solid rgba(56, 189, 248, 0.5);
      color: #f8fafc; font-size: 11px; font-weight: 800; padding: 7px 10px; border-radius: 10px;
    }
    .chip-btn:active { transform: scale(0.94); background: rgba(56, 189, 248, 0.3); }
    .chip-btn.weapon { border-color: rgba(250, 204, 21, 0.65); color: #fde047; }

    /* Varovný bar pri zatýkaní */
    #bustedWrap {
      display: none; position: fixed; top: 14%; left: 50%; transform: translateX(-50%);
      background: rgba(127, 29, 29, 0.9); border: 2px solid #ef4444;
      padding: 6px 14px; border-radius: 10px; text-align: center; z-index: 35; width: 210px;
    }
    #bustedWrap.show { display: block; }
    #bustedWrap span { font-size: 11px; font-weight: 900; letter-spacing: 1px; color: #fecaca; }
    .busted-track { height: 6px; background: rgba(0,0,0,0.4); border-radius: 4px; margin-top: 4px; overflow: hidden; }
    #bustedFill { height: 100%; width: 0%; background: #ef4444; }

    #missionBox {
      display: none; pointer-events: auto;
      background: rgba(15, 23, 42, 0.88); border: 1px solid rgba(250, 204, 21, 0.65);
      border-radius: 12px; padding: 8px 12px;
    }
    #missionBox.show { display: block; }
    #mTitle { font-size: 13px; font-weight: 900; color: #facc15; }
    #mDesc { font-size: 12px; color: #e2e8f0; margin-top: 2px; }
    .m-row { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; font-size: 11px; color: #94a3b8; }
    #btnCancelM { background: rgba(239,68,68,0.25); border: 1px solid #ef4444; color: #fca5a5; border-radius: 6px; padding: 2px 7px; font-size: 11px; font-weight: 700; cursor: pointer; }

    #actionPrompt {
      position: fixed; bottom: 112px; left: 50%; transform: translateX(-50%);
      display: none; pointer-events: auto; z-index: 20;
      background: linear-gradient(135deg, #eab308, #f59e0b); color: #0f172a;
      border: 2px solid #fef08a; border-radius: 999px;
      padding: 10px 20px; font-size: 14px; font-weight: 900; cursor: pointer;
      box-shadow: 0 6px 24px rgba(234, 179, 8, 0.5);
    }
    #actionPrompt.show { display: block; }

    #toast {
      position: fixed; top: 22%; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.94); border: 1px solid rgba(255,255,255,0.22);
      padding: 9px 16px; border-radius: 12px; font-size: 13px; font-weight: 800;
      pointer-events: none; opacity: 0; transition: opacity 0.25s; z-index: 40;
      text-align: center; max-width: 86vw;
    }
    #toast.show { opacity: 1; }

    /* Ovládanie pre mobil */
    .controls {
      position: fixed; bottom: 16px; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: flex-end;
      padding: 0 14px; pointer-events: none; z-index: 15;
    }
    .ctrl-group { display: flex; gap: 8px; align-items: flex-end; pointer-events: auto; }
    .ctrl-col { display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .btn {
      width: 56px; height: 56px; border-radius: 50%;
      background: rgba(15, 20, 30, 0.74); border: 2px solid rgba(255,255,255,0.26);
      color: #fff; font-size: 19px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px); touch-action: none; cursor: pointer;
    }
    .btn.active { background: rgba(56, 189, 248, 0.55); border-color: #38bdf8; transform: scale(0.92); }
    .btn-gas { width: 68px; height: 68px; background: rgba(34, 197, 94, 0.36); border-color: rgba(34, 197, 94, 0.85); }
    .btn-brake { background: rgba(239, 68, 68, 0.34); border-color: rgba(239, 68, 68, 0.8); }
    .btn-drift { width: 50px; height: 50px; font-size: 10px; background: rgba(245, 158, 11, 0.34); border-color: rgba(245, 158, 11, 0.8); }
    .btn-nitro { width: 50px; height: 50px; font-size: 10px; background: rgba(168, 85, 247, 0.4); border-color: rgba(192, 132, 252, 0.9); }
    .btn-car { width: 50px; height: 50px; font-size: 19px; background: rgba(56, 189, 248, 0.34); border-color: #38bdf8; }
    .btn-fire { width: 56px; height: 56px; font-size: 22px; background: rgba(239, 68, 68, 0.48); border-color: #f97316; box-shadow: 0 0 14px rgba(239,68,68,0.4); }
    .btn-siren { width: 46px; height: 46px; font-size: 18px; background: rgba(239, 68, 68, 0.32); border-color: #ef4444; display: none; }

    /* Modálne okná */
    .modal-bg {
      position: fixed; inset: 0; background: rgba(4, 8, 18, 0.82); backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center; z-index: 50; padding: 14px;
    }
    .modal-bg.open { display: flex; }
    .modal {
      width: 100%; max-width: 440px; max-height: 86vh; overflow-y: auto;
      background: #0f172a; border: 1px solid rgba(56, 189, 248, 0.45);
      border-radius: 18px; padding: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.7);
      touch-action: pan-y;
    }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .modal-head h2 { font-size: 18px; font-weight: 900; color: #38bdf8; }
    .close-btn { background: rgba(255,255,255,0.1); border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; font-size: 16px; cursor: pointer; }
    .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
    .tab { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); color: #cbd5e1; padding: 8px 4px; border-radius: 10px; font-size: 11px; font-weight: 800; cursor: pointer; }
    .tab.active { background: #0284c7; color: #fff; border-color: #38bdf8; }
    .card {
      background: #1e293b; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 10px 12px; margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .card h4 { font-size: 13px; font-weight: 800; color: #f8fafc; }
    .card p { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .buy-btn {
      background: #16a34a; color: #fff; border: none; border-radius: 8px;
      padding: 7px 11px; font-size: 12px; font-weight: 800; cursor: pointer; white-space: nowrap;
    }
    .buy-btn.blue { background: #0284c7; }
    .buy-btn.red { background: #dc2626; }
    .swatches { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; }
    .pc-hint { position: fixed; bottom: 6px; left: 50%; transform: translateX(-50%); font-size: 10px; color: rgba(255,255,255,0.42); pointer-events: none; white-space: nowrap; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="panel">
      <div class="top-stats">
        <span id="moneyHud">$2,500</span>
        <span id="levelHud">LVL 1</span>
        <span id="clockHud">11:30</span>
      </div>
      <div id="starsHud"></div>
      <div class="sub-row">
        <span id="speedVal">0 KM/H</span>
        <span id="districtHud">Downtown</span>
      </div>
      <div class="hp-wrap"><div id="hpBar"></div></div>
    </div>

    <div class="hud-btns">
      <button class="chip-btn" id="btnPhone">📱 MOBIL</button>
      <button class="chip-btn" id="btnMap">🗺️ MAPA</button>
      <button class="chip-btn weapon" id="btnWeapon">🔫 SMG</button>
    </div>

    <div id="missionBox">
      <div id="mTitle">Misia</div>
      <div id="mDesc">Popis</div>
      <div class="m-row">
        <span id="mTimer">Čas: 50s</span>
        <button id="btnCancelM">Zrušiť</button>
      </div>
    </div>
  </div>

  <div id="bustedWrap">
    <span>🚨 POLÍCIA ŤA ZATÝKA – PRIDAJ PLYN!</span>
    <div class="busted-track"><div id="bustedFill"></div></div>
  </div>

  <button id="actionPrompt">⚡ AKCIA (E)</button>
  <div id="toast"></div>

  <div class="pc-hint">WASD=Jazda • Q=Streľba • R=SMG/RPG • F=Vystúpiť • E=Akcia • Space=Drift • Shift=Nitro • M=Mapa • P=Mobil</div>

  <div class="controls">
    <div class="ctrl-group">
      <div class="ctrl-col">
        <div style="display:flex;gap:8px;align-items:center">
          <div class="btn btn-car" id="btnCar">🚗</div>
          <div class="btn btn-fire" id="btnFire">🔥</div>
          <div class="btn btn-siren" id="btnSiren">🚨</div>
        </div>
        <div style="display:flex;gap:8px">
          <div class="btn" id="btnLeft">◀</div>
          <div class="btn" id="btnRight">▶</div>
        </div>
      </div>
    </div>
    <div class="ctrl-group">
      <div class="ctrl-col">
        <div class="btn btn-nitro" id="btnNitro">NITRO</div>
        <div class="btn btn-drift" id="btnDrift">DRIFT</div>
      </div>
      <div class="btn btn-brake" id="btnBrake">▼</div>
      <div class="btn btn-gas" id="btnGas">▲</div>
    </div>
  </div>

  <div class="modal-bg" id="phoneModal">
    <div class="modal">
      <div class="modal-head">
        <h2>📱 Grand City Smartfón</h2>
        <button class="close-btn" id="closePhone">✕</button>
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="jobs">🎯 Misie</button>
        <button class="tab" data-tab="cars">🏎️ Autá</button>
        <button class="tab" data-tab="props">🏠 Reality</button>
        <button class="tab" data-tab="sys">⚙️ Nast.</button>
      </div>
      <div id="phoneBody"></div>
    </div>
  </div>

  <div class="modal-bg" id="garageModal">
    <div class="modal">
      <div class="modal-head">
        <h2>🔧 Garáž & Pay'n'Spray</h2>
        <button class="close-btn" id="closeGarage">✕</button>
      </div>
      <div id="garageBody"></div>
    </div>
  </div>

  <script src="world-config.js"></script>
  <script src="world-gen.js"></script>
  <script src="audio.js"></script>
  <script src="entities.js"></script>
  <script src="activities.js"></script>
  <script src="world-render.js"></script>
  <script src="game.js"></script>
</body>
</html>
