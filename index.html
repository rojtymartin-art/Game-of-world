<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Grand City 2.5D – Open World</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0c1220; font-family: system-ui, -apple-system, sans-serif; touch-action: none; }
    canvas { display: block; width: 100vw; height: 100vh; }

    /* Horný HUD vľavo */
    #hud {
      position: fixed; top: 14px; left: 14px; pointer-events: none;
      display: flex; flex-direction: column; gap: 8px;
    }
    .panel {
      background: rgba(12, 16, 26, 0.78); border: 1px solid rgba(255,255,255,0.16);
      padding: 8px 14px; border-radius: 12px; backdrop-filter: blur(6px);
      color: #fff; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .speed-row { display: flex; align-items: baseline; gap: 6px; }
    #speedVal { font-size: 28px; font-weight: 900; color: #38bdf8; font-variant-numeric: tabular-nums; }
    .unit { font-size: 11px; color: #94a3b8; font-weight: 700; letter-spacing: 0.5px; }
    #districtHud { font-size: 12px; font-weight: 700; color: #e2e8f0; letter-spacing: 0.4px; }
    #coordsHud { font-size: 10px; color: #64748b; margin-top: 2px; font-family: monospace; }

    /* Tlačidlo na otvorenie celej mapy */
    #btnMap {
      pointer-events: auto; cursor: pointer;
      background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(56, 189, 248, 0.55);
      color: #38bdf8; font-size: 12px; font-weight: 800; letter-spacing: 0.8px;
      padding: 8px 12px; border-radius: 10px; width: fit-content;
      transition: transform 0.1s, background 0.15s;
    }
    #btnMap:active { transform: scale(0.95); background: rgba(56, 189, 248, 0.25); }

    /* GTA banner pri vstupe do novej štvrte */
    #districtBanner {
      position: fixed; top: 22%; left: 50%; transform: translateX(-50%) translateY(10px);
      pointer-events: none; text-align: center; opacity: 0;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }
    #districtBanner.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #bannerTitle {
      font-size: clamp(24px, 5vw, 42px); font-weight: 900; letter-spacing: 2px;
      text-transform: uppercase; color: #fff;
      text-shadow: 0 4px 18px rgba(0,0,0,0.9), 0 0 24px rgba(56,189,248,0.45);
    }
    #bannerSub {
      font-size: 13px; font-weight: 600; color: #cbd5e1; letter-spacing: 1.5px;
      text-transform: uppercase; text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }

    /* Pomôcka pre PC */
    .pc-hint {
      position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
      font-size: 11px; color: rgba(255,255,255,0.45); pointer-events: none;
      white-space: nowrap;
    }

    /* Dotykové ovládanie pre mobil */
    .controls {
      position: fixed; bottom: 20px; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: flex-end;
      padding: 0 16px; pointer-events: none;
    }
    .ctrl-group { display: flex; gap: 10px; align-items: flex-end; pointer-events: auto; }
    .ctrl-col { display: flex; flex-direction: column; gap: 10px; align-items: center; }
    .btn {
      width: 60px; height: 60px; border-radius: 50%;
      background: rgba(15, 20, 30, 0.72); border: 2px solid rgba(255,255,255,0.25);
      color: #fff; font-size: 20px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px); touch-action: none;
    }
    .btn.active { background: rgba(56, 189, 248, 0.55); border-color: #38bdf8; transform: scale(0.93); }
    .btn-gas { width: 72px; height: 72px; background: rgba(34, 197, 94, 0.32); border-color: rgba(34, 197, 94, 0.75); }
    .btn-brake { background: rgba(239, 68, 68, 0.32); border-color: rgba(239, 68, 68, 0.75); }
    .btn-drift { width: 54px; height: 54px; font-size: 11px; background: rgba(245, 158, 11, 0.32); border-color: rgba(245, 158, 11, 0.75); }
    .btn-nitro { width: 54px; height: 54px; font-size: 11px; background: rgba(168, 85, 247, 0.35); border-color: rgba(192, 132, 252, 0.85); }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="panel">
      <div class="speed-row">
        <span id="speedVal">0</span><span class="unit">KM/H</span>
      </div>
      <div id="districtHud">Downtown</div>
      <div id="coordsHud">X: 0 | Y: 0</div>
    </div>
    <button id="btnMap">🗺️ MAPA (M)</button>
  </div>

  <div id="districtBanner">
    <div id="bannerTitle">DOWNTOWN</div>
    <div id="bannerSub">Finančné centrum</div>
  </div>

  <div class="pc-hint">PC: WASD / Šípky • Medzerník = Drift • Shift = Nitro • M = Mapa sveta</div>

  <div class="controls">
    <div class="ctrl-group">
      <div class="btn" id="btnLeft">◀</div>
      <div class="btn" id="btnRight">▶</div>
    </div>
    <div class="ctrl-group">
      <div class="ctrl-col">
        <div class="btn btn-nitro" id="btnNitro">NITRO</div>
        <div class="btn btn-drift" id="btnDrift">DRIFT</div>
      </div>
      <div class="btn btn-brake" id="btnBrake">▼</div>
      <div class="btn btn-gas" id="btnGas">▲</div>
    </div>
  </div>

  <!-- Poradie modulov je fixné -->
  <script src="world-config.js"></script>
  <script src="world-gen.js"></script>
  <script src="world-render.js"></script>
  <script src="game.js"></script>
</body>
</html>
